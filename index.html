<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>株式会社むぅ&もも | 会社概要</title>
  <meta name="description" content="株式会社むぅ&ももの会社概要ページです。" />
  <style>
    :root{
      --bg:#0b0b0f; --card:#12121a; --text:#f5f5f7; --muted:#b6b6c2;
      --accent:#ffd700; --line:rgba(255,255,255,.12);
    }
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
      background:radial-gradient(900px 600px at 20% 0%,rgba(255,215,0,.16),transparent 60%),var(--bg);
      color:var(--text);
    }
    .wrap{max-width:920px;margin:0 auto;padding:28px 18px 60px;}
    .top{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:10px 0 18px;border-bottom:1px solid var(--line);
    }
    .brand{display:flex;gap:10px;align-items:center;}
    .logo{
      width:40px;height:40px;border-radius:14px;
      border:1px solid var(--line);display:grid;place-items:center;
      background:rgba(255,255,255,.04);font-weight:800;color:var(--accent);
    }
    .name{font-weight:800;font-size:16px}
    .sub{color:var(--muted);font-size:12px;margin-top:2px}
    .pill{
      border:1px solid var(--line);
      border-radius:999px;
      padding:7px 10px;
      color:var(--muted);
      font-size:12px;
      background:rgba(255,255,255,.03);
    }
    h1{margin:22px 0 10px;font-size:30px}
    p{margin:0;color:var(--muted);line-height:1.9}
    .card{
      margin-top:16px;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(255,255,255,.03);
      padding:18px;
    }
    .table{width:100%;border-collapse:collapse;margin-top:6px}
    .table th,.table td{
      padding:12px 10px;
      border-bottom:1px solid rgba(255,255,255,.10);
      vertical-align:top;
    }
    .table th{width:160px;color:var(--muted);font-weight:700;text-align:left}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    footer{
      margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
      color:var(--muted);font-size:12px;line-height:1.7
    }
    .note{font-size:12px;color:var(--muted);margin-top:8px}
    @media (max-width:720px){.table th{width:120px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="logo">む</div>
        <div>
          <div class="name">株式会社むぅ&もも</div>
          <div class="sub">mu & momo, Inc.</div>
        </div>
      </div>
      <div class="pill">Company Profile</div>
    </div>

    <h1>会社概要</h1>
    <p>
      株式会社むぅ&ももは、安心・安全を重視したデジタルサービスの開発・運営に取り組む会社です。
    </p>

    <div class="card">
      <table class="table" aria-label="会社概要">
        <tr>
          <th>会社名</th>
          <td>株式会社むぅ&もも</td>
        </tr>
        <tr>
          <th>英語表記</th>
          <td>mu & momo, Inc.</td>
        </tr>
        <tr>
          <th>代表者</th>
          <td>代表取締役　小野維吹</td>
        </tr>
        <tr>
          <th>事業内容</th>
          <td>
            ・アプリケーション/ウェブサービスの企画・開発・運営<br>
            ・関連するデザイン、マーケティング支援
          </td>
        </tr>
        <tr>
          <th>所在地</th>
          <td>東京都板橋区泉町4番5号</td>
        </tr>
        <tr>
          <th>連絡先</th>
          <td>
            お問い合わせ：<a href="mailto:ibukiono@mu-and-momo.com">ibukiono@mu-and-momo.com</a><br>
            <span class="note"></span>
          </td>
        </tr>
        <tr>
          <th>ウェブサイト</th>
          <td><a href="https://mu-and-momo.com">https://mu-and-momo.com</a></td>
        </tr>
      </table>
    </div>

    <footer>
      © <span id="y"></span> 株式会社むぅ&もも
    </footer>
  </div>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>
</body>
</html>
